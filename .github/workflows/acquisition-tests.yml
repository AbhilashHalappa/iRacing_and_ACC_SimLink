name: Overview acquisition tests

on:
  push:
    paths:
      - "src/race_engineer_acquisition/**"
      - "src/desktop/**"
      - "src/iracing/**"
      - "frontend/**"
      - "tests/acquisition/**"
      - "tests/iracing/**"
      - ".github/workflows/acquisition-tests.yml"
  pull_request:
    paths:
      - "src/race_engineer_acquisition/**"
      - "src/desktop/**"
      - "frontend/**"
      - "tests/acquisition/**"
      - ".github/workflows/acquisition-tests.yml"

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile live Overview runtime
        run: python -m compileall -q src
      - name: Run acquisition core tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/acquisition -v
      - name: Run iRacing telemetry adapter tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/iracing -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build Overview frontend
        working-directory: frontend
        run: npm run build
      - name: Run Overview utility tests
        working-directory: frontend
        run: |
          npm run test:track-map
          npm run test:time-units
